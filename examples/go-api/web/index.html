<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>turbo-vibe example</title>
  </head>
  <body>
    <h1>turbo-vibe example</h1>
    <p>Page build: <code id="page">__BUILD_ID__</code></p>
    <p>Public name, inlined at build time: <code id="name">__EXAMPLE_PUBLIC_NAME__</code></p>
    <p>API build: <code id="api">loading…</code></p>
    <p id="user">Checking sign-in…</p>
    <script>
      fetch("/api/health", { cache: "no-store" })
        .then((response) => response.json())
        .then((body) => { document.getElementById("api").textContent = body.build_id; })
        .catch((error) => { document.getElementById("api").textContent = `unavailable (${error.message})`; });
      fetch("/api/me", { cache: "no-store" })
        .then((response) => (response.ok ? response.json() : null))
        .then((body) => {
          const user = document.getElementById("user");
          if (body?.email) {
            user.textContent = `Signed in as ${body.email}`;
          } else {
            user.innerHTML = '<a href="/api/auth/login">Sign in</a>';
          }
        });
    </script>
  </body>
</html>
