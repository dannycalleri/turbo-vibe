# yaml-language-server: $schema=https://unpkg.com/@turbo-vibe/cli@1/schema/turbo-vibe.schema.json
version: 1
project: tv-example
domain: example.turbovibe.ai
environments:
  staging:
    hostname: staging-example.turbovibe.ai
    access: { emails: [daniele.calleri@gmail.com] }
  production:
    access: { emails: [daniele.calleri@gmail.com] }
services:
  api:
    kind: backend
    target: cloudflare-container
    build:
      dockerfile: Dockerfile
      test: docker run --rm -v "$PWD":/src -w /src golang:1.27 go test ./...
    container:
      instance_type: lite
      sleep_after: 5m
      health: /api/health
  web:
    kind: frontend
    target: cloudflare-static
    serve_with: api
    public: [EXAMPLE_PUBLIC_NAME]
    build:
      command: web/build.sh
      output: web/dist
  db:
    kind: database
    target: supabase
    region: eu-central-1
    plan: free
  auth:
    kind: identity
    target: workos
