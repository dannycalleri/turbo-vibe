name: turbo-vibe promote

on:
  workflow_call:
    inputs:
      config:
        description: Path to the project's turbo-vibe.yaml.
        type: string
        default: turbo-vibe.yaml
      use-local-cli:
        description: Build the CLI from the checked-out repository instead of npm. Only the kit itself sets this.
        type: boolean
        default: false
      allow-deletions:
        description: Let apply delete or replace resources. Off by default, so an unintended deletion stops the run.
        type: boolean
        default: false
      confirm-build:
        description: The ID of the build to promote. The run stops if it is not the latest staging build that passed.
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      TURBO_VIBE_STATE_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_ORGANIZATION:
        required: false
      WORKOS_API_KEY:
        required: false
      WORKOS_CLIENT_ID:
        required: false
      VERCEL_API_TOKEN:
        required: false
      VERCEL_TEAM_ID:
        required: false

env:
  TURBO_VIBE_CLI: "@turbo-vibe/cli@1.0.0"
  NODE_VERSION: "24"
  TOFU_VERSION: "1.13.1"
  CONFIG: ${{ inputs.config }}

permissions:
  contents: read

jobs:
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: turbo-vibe-production-${{ inputs.config }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.use-local-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.use-local-cli && 'pnpm' || '' }}
      - name: Install the turbo-vibe CLI
        env:
          USE_LOCAL_CLI: ${{ inputs.use-local-cli }}
        run: |
          bin="$RUNNER_TEMP/turbo-vibe-bin"
          mkdir -p "$bin"
          if [ "$USE_LOCAL_CLI" = "true" ]; then
            pnpm install --frozen-lockfile
            pnpm build
            printf '#!/bin/sh\nexec node "%s/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$bin/turbo-vibe"
          else
            printf '#!/bin/sh\nexec npx --yes "%s" "$@"\n' "$TURBO_VIBE_CLI" > "$bin/turbo-vibe"
          fi
          chmod +x "$bin/turbo-vibe"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Choose the latest staging build that passed
        id: choose
        run: |
          build_id=$(turbo-vibe --config "$CONFIG" promote --env production --choose --confirm "$CONFIRM_BUILD")
          echo "build-id=$build_id" >> "$GITHUB_OUTPUT"
        env:
          CONFIRM_BUILD: ${{ inputs.confirm-build }}
      - name: Name the build to confirm
        if: failure() && steps.choose.outcome == 'failure'
        run: |
          build_id=$(turbo-vibe --config "$CONFIG" promote --env production --choose) || exit 0
          echo "The build ready to promote is \`$build_id\`. Run **Deploy to production** again with confirm-build set to \`$build_id\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.choose.outputs.build-id }}
          persist-credentials: false
      - name: Rebuild the CLI from the chosen commit
        if: inputs.use-local-cli
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: turbo-vibe --config "$CONFIG" apply --env production ${ALLOW_DELETIONS:+--allow-deletions}
        env:
          ALLOW_DELETIONS: ${{ inputs.allow-deletions && 'yes' || '' }}
      - run: turbo-vibe --config "$CONFIG" migrate --env production
      - run: turbo-vibe --config "$CONFIG" promote --env production --build-id "$BUILD_ID"
        env:
          BUILD_ID: ${{ steps.choose.outputs.build-id }}
      - run: turbo-vibe --config "$CONFIG" smoke --env production --build-id "$BUILD_ID"
        env:
          BUILD_ID: ${{ steps.choose.outputs.build-id }}
