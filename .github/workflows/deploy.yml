name: turbo-vibe deploy

on:
  workflow_call:
    inputs:
      config:
        description: Path to the project's turbo-vibe.yaml.
        type: string
        default: turbo-vibe.yaml
      use-local-cli:
        description: Build the CLI from the checked-out repository instead of npm. Only the kit itself sets this.
        type: boolean
        default: false
      allow-deletions:
        description: Let apply delete or replace resources. Off by default, so an unintended deletion stops the run.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      TURBO_VIBE_STATE_BUCKET:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      SUPABASE_ACCESS_TOKEN:
        required: false
      SUPABASE_ORGANIZATION:
        required: false
      WORKOS_API_KEY:
        required: false
      WORKOS_CLIENT_ID:
        required: false
      VERCEL_API_TOKEN:
        required: false
      VERCEL_TEAM_ID:
        required: false

env:
  TURBO_VIBE_CLI: "@turbo-vibe/cli@1.0.0-rc.1" # x-release-please-version
  NODE_VERSION: "24"
  TOFU_VERSION: "1.13.1"
  CONFIG: ${{ inputs.config }}
  BUILD_ID: ${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.use-local-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.use-local-cli && 'pnpm' || '' }}
      - name: Install the turbo-vibe CLI
        env:
          USE_LOCAL_CLI: ${{ inputs.use-local-cli }}
        run: |
          bin="$RUNNER_TEMP/turbo-vibe-bin"
          mkdir -p "$bin"
          if [ "$USE_LOCAL_CLI" = "true" ]; then
            pnpm install --frozen-lockfile
            pnpm build
            printf '#!/bin/sh\nexec node "%s/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$bin/turbo-vibe"
          else
            # npx treats the package's npm-shrinkwrap.json as advice; `npm ci` in the unpacked package follows it exactly.
            cli="$RUNNER_TEMP/turbo-vibe-cli"
            mkdir -p "$cli"
            (cd "$cli" && npm pack "$TURBO_VIBE_CLI" --silent >/dev/null && tar xzf ./*.tgz)
            (cd "$cli/package" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
            printf '#!/bin/sh\nexec node "%s/package/dist/cli.js" "$@"\n' "$cli" > "$bin/turbo-vibe"
          fi
          chmod +x "$bin/turbo-vibe"
          echo "$bin" >> "$GITHUB_PATH"
      - run: turbo-vibe --config "$CONFIG" test
      - run: turbo-vibe --config "$CONFIG" deploy --env staging --build-id "$BUILD_ID" --dry-run
        env:
          TURBO_VIBE_SECRETS: ${{ toJSON(secrets) }}

  staging:
    name: Deploy staging
    needs: test
    # Staging's tokens reach only main, on a push or a maintainer's manual run; pull requests stop after the test job here, and previews use the `preview` environment's own tokens.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: turbo-vibe-staging-${{ inputs.config }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.use-local-cli
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ inputs.use-local-cli && 'pnpm' || '' }}
      - name: Install the turbo-vibe CLI
        env:
          USE_LOCAL_CLI: ${{ inputs.use-local-cli }}
        run: |
          bin="$RUNNER_TEMP/turbo-vibe-bin"
          mkdir -p "$bin"
          if [ "$USE_LOCAL_CLI" = "true" ]; then
            pnpm install --frozen-lockfile
            pnpm build
            printf '#!/bin/sh\nexec node "%s/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$bin/turbo-vibe"
          else
            # npx treats the package's npm-shrinkwrap.json as advice; `npm ci` in the unpacked package follows it exactly.
            cli="$RUNNER_TEMP/turbo-vibe-cli"
            mkdir -p "$cli"
            (cd "$cli" && npm pack "$TURBO_VIBE_CLI" --silent >/dev/null && tar xzf ./*.tgz)
            (cd "$cli/package" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
            printf '#!/bin/sh\nexec node "%s/package/dist/cli.js" "$@"\n' "$cli" > "$bin/turbo-vibe"
          fi
          chmod +x "$bin/turbo-vibe"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - run: turbo-vibe --config "$CONFIG" apply --env staging ${ALLOW_DELETIONS:+--allow-deletions}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TURBO_VIBE_SECRETS: ${{ toJSON(secrets) }}
          TURBO_VIBE_VARS: ${{ toJSON(vars) }}
          ALLOW_DELETIONS: ${{ inputs.allow-deletions && 'yes' || '' }}
      - run: turbo-vibe --config "$CONFIG" migrate --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      - run: turbo-vibe --config "$CONFIG" deploy --env staging --build-id "$BUILD_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TURBO_VIBE_SECRETS: ${{ toJSON(secrets) }}
          TURBO_VIBE_VARS: ${{ toJSON(vars) }}
      - run: turbo-vibe --config "$CONFIG" smoke --env staging --build-id "$BUILD_ID"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      - name: Name the build to promote
        run: echo "Build \`$BUILD_ID\` passed staging. To promote it, run **Deploy to production** with confirm-build \`$BUILD_ID\`." >> "$GITHUB_STEP_SUMMARY"
