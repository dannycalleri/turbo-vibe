name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow-deletions:
        description: Let apply delete or replace resources
        type: boolean
        default: false

permissions:
  contents: read

env:
  NPM_VERSION: "11.19.1"

jobs:
  check:
    name: Kit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - run: npx --yes "npm@$NPM_VERSION" ci
      - run: make check
      - run: make validate-infra lint-workflows integration-tests

  example:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      config: examples/go-api/turbo-vibe.yaml
      use-local-cli: true
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  vercel-example:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      config: examples/vercel-static/turbo-vibe.yaml
      use-local-cli: true
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  nextjs-example:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      config: examples/nextjs/turbo-vibe.yaml
      use-local-cli: true
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  python-example:
    needs: check
    uses: ./.github/workflows/deploy.yml
    with:
      config: examples/python-api/turbo-vibe.yaml
      use-local-cli: true
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit
