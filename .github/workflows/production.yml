name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm-build:
        description: "Empty: the newest build that passed staging, where production has a required reviewer. An older build's ID: a rollback"
        type: string
        default: ""
      allow-deletions:
        description: Let apply delete or replace resources
        type: boolean
        default: false
      example:
        description: The example to promote, or all of them
        type: choice
        options: [all, example, vercel-example, nextjs-example, python-example]
        default: all

permissions:
  contents: read

jobs:
  example:
    if: inputs.example == 'all' || inputs.example == 'example'
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/go-api/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  vercel-example:
    if: inputs.example == 'all' || inputs.example == 'vercel-example'
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/vercel-static/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  nextjs-example:
    if: inputs.example == 'all' || inputs.example == 'nextjs-example'
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/nextjs/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  python-example:
    if: inputs.example == 'all' || inputs.example == 'python-example'
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/python-api/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit
