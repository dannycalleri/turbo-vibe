name: Deploy to production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/go-api/turbo-vibe.yaml
      use-local-cli: true
    secrets: inherit

  vercel-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/vercel-static/turbo-vibe.yaml
      use-local-cli: true
    secrets: inherit

  nextjs-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/nextjs/turbo-vibe.yaml
      use-local-cli: true
    secrets: inherit

  python-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/python-api/turbo-vibe.yaml
      use-local-cli: true
    secrets: inherit
