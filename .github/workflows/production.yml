name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      confirm-build:
        description: The ID of the build to promote, as the last Staging run reports it
        type: string
        required: true
      allow-deletions:
        description: Let apply delete or replace resources
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/go-api/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  vercel-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/vercel-static/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  nextjs-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/nextjs/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit

  python-example:
    uses: ./.github/workflows/promote.yml
    with:
      config: examples/python-api/turbo-vibe.yaml
      use-local-cli: true
      confirm-build: ${{ inputs.confirm-build }}
      allow-deletions: ${{ inputs.allow-deletions == true }}
    secrets: inherit
