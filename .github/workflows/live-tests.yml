name: Live tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbo-vibe-live-tests
  cancel-in-progress: false

jobs:
  live:
    name: Live run
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/live-run.yml
    secrets: inherit
