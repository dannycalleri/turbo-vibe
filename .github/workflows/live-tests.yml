name: Live tests

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turbo-vibe-live-tests
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  TOFU_VERSION: "1.13.1"
  BUILD_ID: ${{ github.sha }}
  BRANCH: live-${{ github.run_number }}

jobs:
  live:
    name: Deploy, smoke-test and remove every example
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: live
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TURBO_VIBE_STATE_BUCKET: ${{ secrets.TURBO_VIBE_STATE_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORGANIZATION: ${{ secrets.SUPABASE_ORGANIZATION }}
      WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
      WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Build the CLI
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          bin="$RUNNER_TEMP/turbo-vibe-bin"
          mkdir -p "$bin"
          printf '#!/bin/sh\nexec node "%s/dist/cli.js" "$@"\n' "$GITHUB_WORKSPACE" > "$bin/turbo-vibe"
          chmod +x "$bin/turbo-vibe"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Run each example as a preview, then remove it
        run: |
          outcomes="$RUNNER_TEMP/outcomes"
          : > "$outcomes"
          removal=ok
          for example in python-api vercel-static nextjs; do
            config="examples/$example/turbo-vibe.yaml"
            if turbo-vibe --config "$config" preview deploy --branch "$BRANCH" --build-id "$BUILD_ID"; then
              echo "$example passed" >> "$outcomes"
            else
              echo "$example failed" >> "$outcomes"
            fi
            turbo-vibe --config "$config" preview remove --branch "$BRANCH" || removal=failed
          done
          echo "removal=$removal" >> "$GITHUB_ENV"
      - name: Date the Go example by its latest passing staging build
        run: |
          if build=$(turbo-vibe --config examples/go-api/turbo-vibe.yaml promote --env production --choose) \
            && passed=$(git log -1 --format=%cs "$build"); then
            echo "go-api passed $passed" >> "$RUNNER_TEMP/outcomes"
          fi
      - name: Update COMPATIBILITY.md
        run: |
          jq -Rn --arg date "$(date -u +%F)" '
            [inputs | split(" ")] as $rows
            | { date: $date,
                examples: ($rows | map({ (.[0]): .[1] }) | add // {}),
                passedOn: ($rows | map(select(length == 3) | { (.[0]): .[2] }) | add // {}) }
          ' "$RUNNER_TEMP/outcomes" > "$RUNNER_TEMP/results.json"
          turbo-vibe compatibility --results "$RUNNER_TEMP/results.json"
          if ! git diff --quiet COMPATIBILITY.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: record the weekly live run in COMPATIBILITY.md" COMPATIBILITY.md
            if git pull --rebase origin main; then
              git push origin HEAD:main
            else
              git rebase --abort
              echo "::warning::main changed COMPATIBILITY.md during the run; this week's results were not committed"
            fi
          fi
      - name: Fail when a preview could not be removed
        if: always() && env.removal == 'failed'
        run: |
          echo "::error::a preview-live-${{ github.run_number }} environment was not removed; run turbo-vibe preview remove --branch $BRANCH for it"
          exit 1
