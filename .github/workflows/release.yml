name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NPM_VERSION: "11.19.1"

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # The release pull request bumps the CLI pin in three workflow files, which GITHUB_TOKEN may never change.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish:
    name: Publish @turbo-vibe/cli
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    # Required reviewers on this environment, and npm's trusted publisher limited to it, keep a release from publishing alone.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag's commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: The tag, the package, the shrinkwrap and the workflows name the same version
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG does not match package.json $version"; exit 1; }
          test "$(node -p 'require("./npm-shrinkwrap.json").version')" = "$version"
          grep -q "@turbo-vibe/cli@$version\"" .github/workflows/deploy.yml
          grep -q "@turbo-vibe/cli@$version\"" .github/workflows/promote.yml
          grep -q "@turbo-vibe/cli@$version\"" .github/workflows/preview.yml
      - run: npx --yes "npm@$NPM_VERSION" ci
      - run: make check validate-infra lint-workflows
      - run: make build
      - name: Publish, under the dist-tag next for a prerelease
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          case "$TAG" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac

  major-tag:
    name: Move the major tag
    needs: [release-please, publish]
    if: ${{ !contains(needs.release-please.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          newest=$(git tag --list "$major.*.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$TAG" != "$newest" ]; then
            echo "$TAG is not the newest $major release ($newest); $major stays where it is"
            exit 0
          fi
          git tag --force "$major" "$TAG^{commit}"
          git push --force origin "refs/tags/$major"
